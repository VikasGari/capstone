# Global Configuration for Brokerage Rules & Trading Policy Assistant

# Embedding settings (Local, Open-Source via sentence-transformers)
embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

# Reranking settings (Local, Open-Source Cross-Encoder)
reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Vector Store settings (FAISS In-Process)
vector_store:
  persist_directory: "data/faiss_index"

# Ingestion & Chunking settings
chunking:
  chunk_size: 600
  chunk_overlap: 100

# Hybrid Retrieval settings
retrieval:
  top_k_semantic: 10
  top_k_bm25: 10
  rrf_k: 60              # RRF parameter constant
  rerank_top_k: 4       # Top items kept after reranking
  min_relevance_score: 0.1 # Minimum score to prevent hallucination
  enable_query_transform: true
  enable_reranking: true

# LLM Generation & Evaluation Rate Limiting settings
generation:
  primary_model: "gemini-3.5-flash-lite"
  fallback_model: "gemini-2.5-flash-lite"
  temperature: 0.0
  max_retries: 3
  rate_limit_delay_seconds: 4.0 # Delay in seconds between API calls (4.0s = 15 RPM). Set to null/None to disable rate limiting.
  refusal_message: "I apologize, but I cannot find information in the available trading policies to answer your query. Please refer to the official exchange site or contact support."
  disclaimer_text: "\n\n*Disclaimer: This information is derived from brokerage and exchange policy documents for informational purposes only. It does not constitute financial, investment, or legal advice.*"

# FastAPI & UI Server settings
api:
  host: "127.0.0.1"
  port: 8000
  title: "Brokerage Policy & Trading Rules Assistant"
  gradio_theme: "soft"

# System Paths
paths:
  corpus_directory: "data/corpus"
  golden_set_path: "data/golden_set.json"
  docs_directory: "docs"
